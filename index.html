<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4e8">
<title>Adivinha o que é</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf4e8; --card:#ffffff; --ink:#2b2135; --muted:#7a6e85; --line:#eadfcd; --soft:#f6ede0;
  --accent:#ff6b4a; --accent-ink:#ffffff; --ok:#1f9d63; --no:#e5484d; --maybe:#d98a00;
  --shadow:0 2px 0 rgba(43,33,53,.06), 0 8px 24px rgba(43,33,53,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1722; --card:#27202f; --ink:#f4eefa; --muted:#a99cb6; --line:#3a3045; --soft:#2f2738;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito",system-ui,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3,.code,.qtext{font-family:"Baloo 2","Nunito",sans-serif;line-height:1.1}
h1{font-size:2.2rem;margin:.2em 0}
h2{font-size:1.25rem;margin:0 0 .6em}
main{max-width:640px;margin:0 auto;padding:12px 16px 48px;display:flex;flex-direction:column;gap:14px}
.topbar{max-width:640px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:28px 20px}
.logo{font-size:3rem;line-height:1;display:inline-grid;place-items:center;width:84px;height:84px;border-radius:26px;background:var(--accent);transform:rotate(-6deg);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;text-align:left;margin:14px 0}
.field>span{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;min-height:48px}
input:focus,select:focus{border-color:var(--accent)}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;min-height:46px;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.big{width:100%;font-size:1.1rem;min-height:56px;margin-top:6px}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.maybe{background:var(--maybe);border-color:var(--maybe);color:#fff}
.alert{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:10px 12px;margin:12px 0;text-align:left}
.joincode{margin-top:14px;text-align:left}
.joincode summary{cursor:pointer;color:var(--muted);font-weight:700;text-align:center}
.joincode .row{margin-top:10px;flex-wrap:nowrap}
.joincode input{text-transform:uppercase;letter-spacing:.2em}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.share{display:flex;gap:14px;align-items:center;margin-top:10px}
.qr{flex:none;width:132px;height:132px;background:#fff;border-radius:14px;padding:6px;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.sharebtns{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.link{font-size:.85rem;min-height:40px;padding:8px 10px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:middle;white-space:nowrap}
.tag.off{color:var(--no)} .tag.spec{color:var(--accent);border-color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.av.xl{width:96px;height:96px;border-radius:28px;font-size:2.6rem;border:3px solid var(--card);box-shadow:0 0 0 3px var(--accent)}
.mephoto{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
label.btn{display:inline-flex;align-items:center;gap:6px}
.sugs{display:flex;flex-direction:column;gap:6px}
.sug{font:inherit;text-align:left;background:var(--soft);color:var(--ink);border:2px solid transparent;border-radius:12px;padding:10px 12px;cursor:pointer;min-height:44px}
.sug:hover,.sug:focus-visible{border-color:var(--accent);outline:none}
.turnbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--pc);color:#fff;font-weight:800}
.turnbar .av{background:rgba(255,255,255,.25)}
.secret{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.secret .item{font-family:"Baloo 2",sans-serif;font-size:1.6rem;font-weight:800}
.blur{filter:blur(9px);user-select:none}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:16px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:800;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 4px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--pc);background:var(--pc);color:#fff}
.chip small{font-weight:600;opacity:.8}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:.88rem;color:var(--muted);margin:2px 0 0}
.answer{border:3px solid var(--accent)}
.qtext{font-size:1.5rem;font-weight:800;margin:8px 0}
.ansrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ansrow .btn{min-height:56px;font-size:1.05rem}
.ansrow.two{grid-template-columns:1fr 1fr}
.checks{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.checks label{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:700;cursor:pointer}
.checks input{width:22px;height:22px;min-height:0;accent-color:var(--accent)}
.wait{display:flex;align-items:center;gap:10px}
.dots{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.pcard.turn{border-color:var(--pc)}
.pcard.out{opacity:.85}
.phead{display:flex;align-items:center;gap:10px}
.pname{flex:1;min-width:0}
.pname b{word-break:break-word}
.score{font-weight:800;font-size:1.1rem;white-space:nowrap}
.pstatus{margin-top:8px;font-size:.92rem}
.hints{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.hints li{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:.9rem}
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.log li{padding:8px 10px;border-radius:12px;background:var(--soft);font-size:.93rem}
.hchips{flex-wrap:nowrap;overflow-x:auto;margin-top:0;padding-bottom:4px;scrollbar-width:thin}
.hchips .chip{flex:none;min-height:40px;padding:6px 12px}
.autoh .btn{text-align:left;font-weight:700}
.log li.sys{background:transparent;border:1px dashed var(--line);color:var(--muted);text-align:center}
.badge{display:inline-block;font-size:.78rem;font-weight:800;padding:1px 9px;border-radius:999px;color:#fff;margin-left:4px;white-space:nowrap}
.badge.sim{background:var(--ok)} .badge.nao{background:var(--no)} .badge.naosei{background:var(--maybe)} .badge.wait,.badge.skip{background:var(--muted)}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--soft)}
.rank li.win{outline:3px solid var(--accent)}
.trophy{font-size:3rem;text-align:center}
details.rules summary{cursor:pointer;font-weight:800;font-family:"Baloo 2",sans-serif;font-size:1.15rem}
details.rules ul{padding-left:20px;margin:10px 0 0} details.rules li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:.25s;z-index:10;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* topo compacto */
.topbar .row{flex-wrap:nowrap;gap:6px}
.topbar .btn.sm{min-height:36px;padding:4px 10px}
/* placar fixo: quem joga pulsa, barra de tempo (só visual) */
.board{position:sticky;top:0;z-index:5;margin:0 -16px;padding:8px 16px 10px;background:var(--bg)}
.board .seats{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px;box-shadow:var(--shadow)}
.seat{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;opacity:.55;transition:opacity .2s}
.seat.on{opacity:1}
.seat .av{width:40px;height:40px}
.seat.on .av{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pc);animation:bob 1.2s ease-in-out infinite}
.seat.out .av{filter:grayscale(1)}
.seat .nm{font-size:.78rem;font-weight:800;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seat .pt{font-size:.75rem;font-weight:800;color:var(--muted)}
.seat.off .nm{color:var(--no)}
.timer{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:8px}
.timer i{display:block;height:100%;background:var(--pc);border-radius:6px;animation:drain 60s linear forwards}
.tstat{display:flex;justify-content:space-between;font-size:.85rem;font-weight:800;margin-top:4px}
.tstat span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes drain{from{width:100%}to{width:0}}
/* ações em cartões grandes */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.act{font:inherit;border:2px solid transparent;border-radius:16px;padding:12px 4px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;
  background:color-mix(in srgb,var(--ac) 14%,var(--card));color:var(--ink);transition:transform .1s}
.act .ic{font-size:1.8rem;line-height:1.1}
.act b{font-weight:800;font-size:.95rem}
.act small{font-size:.75rem;color:var(--muted);font-weight:700}
.act.on{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 26%,var(--card));transform:translateY(-2px)}
.act:active{transform:translateY(1px)}
.targets{display:flex;gap:10px;margin:6px 0 14px;overflow-x:auto;padding:4px 2px}
.tgt{font:inherit;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:60px;opacity:.5}
.tgt .av{width:48px;height:48px}
.tgt.on{opacity:1}
.tgt.on .av{box-shadow:0 0 0 3px var(--card),0 0 0 6px var(--pc)}
.tgt b{font-size:.8rem;font-weight:800}
/* carta secreta: segure para virar */
.scard{display:flex;align-items:center;gap:14px}
.flip{flex:none;width:96px;height:128px;perspective:700px;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;border:0;padding:0;background:none;font:inherit}
.flip .in{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.show .in{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;text-align:center;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.flip .front{background:var(--accent);color:#fff;font-family:"Baloo 2",sans-serif;font-size:3rem;font-weight:800;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px)}
.flip .back{background:var(--card);border:3px solid var(--accent);transform:rotateY(180deg);color:var(--ink)}
.flip .back .e{font-size:1.6rem}
.flip .back b{font-family:"Baloo 2",sans-serif;font-size:1rem;line-height:1.1;word-break:break-word}
/* histórico em conversa */
.chat{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:10px;max-height:420px;overflow:auto}
.chat li{display:flex;flex-direction:column;gap:4px}
.msg{display:flex;align-items:flex-end;gap:6px;max-width:88%}
.msg .av{width:28px;height:28px;border-radius:50%;font-size:.95rem}
.msg.r{align-self:flex-end;flex-direction:row-reverse}
.bub{padding:8px 11px;border-radius:4px 16px 16px 16px;background:color-mix(in srgb,var(--pc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--pc) 30%,transparent);font-size:.93rem}
.msg.r .bub{border-radius:16px 4px 16px 16px}
.bub .who{display:block;font-size:.72rem;font-weight:800;color:var(--muted)}
.bub.ans{font-weight:800;color:#fff;border:0}
.bub.ans.sim{background:var(--ok)} .bub.ans.nao{background:var(--no)} .bub.ans.naosei{background:var(--maybe)} .bub.ans.wait,.bub.ans.skip{background:var(--muted)}
.chat li.mid{align-items:center}
.chat .note2{max-width:92%;text-align:center;font-size:.88rem;padding:7px 12px;border-radius:14px;background:var(--soft)}
.chat .note2.hint{background:color-mix(in srgb,#a855f7 14%,var(--card));border:1px solid color-mix(in srgb,#a855f7 30%,transparent)}
.chat .note2.good{background:color-mix(in srgb,var(--ok) 16%,var(--card));border:1px solid color-mix(in srgb,var(--ok) 40%,transparent)}
.chat .note2.bad{background:color-mix(in srgb,var(--no) 12%,var(--card))}
.chat .sys{font-size:.8rem;color:var(--muted);text-align:center}
/* efeitos na tela toda: carimbo e festa */
#fx{position:fixed;inset:0;z-index:20;pointer-events:none;display:grid;place-items:center}
.stamp{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:86vw}
.stamp .st{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:3.4rem;line-height:1;padding:6px 26px 2px;border:6px solid currentColor;border-radius:18px;background:var(--card);
  box-shadow:0 10px 40px rgba(0,0,0,.25);animation:stamp 1.7s ease forwards}
.stamp .st.sim{color:var(--ok)} .stamp .st.nao{color:var(--no)} .stamp .st.naosei{color:var(--maybe)} .stamp .st.dica{color:#a855f7} .stamp .st.erro{color:var(--no)}
.stamp .sub{background:var(--ink);color:var(--bg);font-weight:800;padding:6px 12px;border-radius:12px;text-align:center;font-size:.9rem;animation:fade 1.7s ease forwards}
@keyframes stamp{0%{transform:scale(2.6) rotate(-16deg);opacity:0}18%{transform:scale(.92) rotate(-8deg);opacity:1}26%{transform:scale(1) rotate(-8deg)}82%{opacity:1}100%{opacity:0;transform:scale(1) rotate(-8deg)}}
@keyframes fade{0%,12%{opacity:0}22%,82%{opacity:1}100%{opacity:0}}
.party{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,14,26,.55);animation:fade 3.2s ease forwards;overflow:hidden}
.party .box{position:relative;z-index:1;background:var(--card);border-radius:24px;padding:22px 28px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:popin .5s cubic-bezier(.3,1.6,.5,1)}
.party .av{width:72px;height:72px;border-radius:22px;font-size:2.2rem}
.party h3{margin:4px 0 0;font-size:1.6rem}
.party .it{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.5rem;padding:4px 16px;border-radius:14px;background:color-mix(in srgb,var(--pc) 18%,var(--card));border:2px solid var(--pc)}
.party .plus{color:var(--ok);font-weight:800;font-size:1.2rem;animation:bob .8s ease-in-out infinite}
.party .cf{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes popin{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){
  .seat.on .av,.party .plus{animation:none}
  .stamp .st{animation:fade 1.7s ease forwards}
  .party .cf{display:none}
  .flip .in{transition:none}
}
@media (max-width:420px){
  .share{flex-direction:column;align-items:stretch}
  .qr{align-self:center}
  h1{font-size:1.9rem}
  .brand .long{display:none}
  .stamp .st{font-size:2.8rem}
}
</style>
</head>
<body>
<div class="topbar" id="topbar" hidden></div>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>
<div id="fx" aria-live="polite"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
<script src="perguntas.js"></script>
<script src="itens/categorias.js"></script>
<script>
"use strict";
/* =====================================================================
   ITENS: ficam em itens/<categoria>.json (gerados por tools/gerar_itens.py).
   O jogo baixa só as categorias sorteadas na partida.
   ===================================================================== */
const CATS = window.CATEGORIAS || {};
const LEVELS = {fm:'Fácil + Médio', f:'Fácil', m:'Médio'};
const itemCache = {};
function loadCat(cat){
  if(!itemCache[cat]) itemCache[cat] = fetch('itens/'+cat+'.json').then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
    .catch(e=>{ delete itemCache[cat]; throw e; });
  return itemCache[cat];
}
/* Perguntas prontas (o dono do item responde Sim / Não / Não sei) */
const QUESTIONS = [
  'É um ser vivo?','É um animal?','Dá para comer?','É doce?','É salgado?',
  'Cabe na palma da mão?','É maior que uma pessoa?','Tem dentro de casa?','Fica ao ar livre?',
  'Usa eletricidade ou bateria?','É feito de metal?','É feito de plástico?','Tem pernas ou patas?',
  'Voa?','Vive ou fica na água?','É usado na cozinha?','Crianças gostam?','Faz barulho?',
  'É perigoso?','Existe no Brasil?','Tem cor marcante?','Usa uniforme?','Trabalha à noite?',
  'É um lugar fechado?','Dá para visitar?','Fica perto do mar?','Tem a ver com saúde?','Tem a ver com festa?'
];

/* Banco de perguntas prontas (arquivo perguntas.js). Se ele não carregar, usa a lista acima. */
const QBANK = (window.PERGUNTAS && window.PERGUNTAS.geral) ? window.PERGUNTAS : {geral:QUESTIONS};
const QTOTAL = Object.values(QBANK).reduce((n,l)=>n+l.length,0);
const qCache = {};
function qGroup(cat){ return (CATS[cat]&&CATS[cat].q)||'geral'; }
function questionsFor(cat){
  const g=qGroup(cat);
  if(!qCache[g]){ const list=(g==='geral'?[]:(QBANK[g]||[])).concat(QBANK.geral||[]); qCache[g]={list,keys:list.map(norm)}; }
  return qCache[g];
}
function rng(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function randomQs(cat){
  const gk=qGroup(cat); const r=rng(ui.sugSeed*31+gk.length*7919); const own=gk==='geral'?[]:(QBANK[gk]||[]), g=QBANK.geral||[]; const out=new Set();
  for(let guard=0; out.size<6 && guard<60; guard++){ const from=(out.size<4&&own.length)?own:g; if(from.length) out.add(from[Math.floor(r()*from.length)]); }
  return [...out];
}

const COLORS  = ['#ff6b4a','#3b82f6','#1f9d63','#a855f7'];
const AVATARS = ['🦊','🐼','🐸','🦉'];

/* ============================== ENGINE START ============================== */
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/[^a-z0-9 ]/g,' ').replace(/\b(o|a|os|as|um|uma|de|do|da|dos|das)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}
function mkPlayer(pid,name,color){ return {pid,name,color,online:true,item:null,cat:null,alive:true,score:0,hintsUsed:0,hints:[],foundBy:null}; }
function newState(code,hostPid,hostName){
  return {code,hostPid,phase:'lobby',category:'mix',level:'fm',players:[mkPlayer(hostPid,hostName,0)],turn:0,pending:null,log:[],seq:0,round:0,photos:{},photoV:0};
}
function P(pid){ return S.players.find(p=>p.pid===pid); }
function freeColor(){ const used=new Set(S.players.map(p=>p.color)); for(let i=0;i<MAX_PLAYERS;i++) if(!used.has(i)) return i; return 0; }
function addLog(e){ e.id=++S.seq; S.log.push(e); if(S.log.length>300) S.log.shift(); return e; }
/* Regra original: termina quando restam 2 itens sem descobrir.
   (Com só 2 jogadores, termina quando resta 1 — senão nem começaria.) */
function aliveLimit(){ return S.players.length>=3 ? 2 : 1; }
/* picks: um item sorteado por jogador ({n,h,a,cat}), preparado pelo anfitrião em prepararItens(). */
function startGame(picks){
  S.players.forEach((p,i)=>{
    const it=picks[i%picks.length];
    Object.assign(p,{item:{n:it.n,h:it.h,a:it.a||[]},cat:it.cat,alive:true,score:0,hintsUsed:0,hints:[],foundBy:null});
  });
  S.phase='playing'; S.pending=null; S.log=[]; S.round++;
  S.turn=Math.floor(Math.random()*S.players.length);
  if(!S.players[S.turn].online) nextTurn();
  addLog({k:'sys',text:'A partida começou! Cada um recebeu um item secreto. '+S.players[S.turn].name+' começa.'});
}
/* Dicas prontas "não tão óbvias", da mais vaga para a menos vaga. A última dica do item
   (a mais reveladora) nunca entra; no lugar, dicas sobre o nome (palavras, letras). */
function autoHints(item){
  if(!item) return [];
  const h=item.h||[], nome=norm(item.n), pal=nome.split(' ').filter(Boolean), letras=nome.replace(/[^a-z0-9]/g,'');
  const L=c=>'“'+c.toUpperCase()+'”';
  return [h[0],
    pal.length>1?'O nome tem '+pal.length+' palavras.':'O nome é uma palavra só.',
    h[1],
    'O nome tem '+letras.length+' letras'+(pal.length>1?' (sem contar os espaços).':'.'),
    'O nome termina com a letra '+L(letras.slice(-1))+'.',
    h[2],
    'O nome começa com a letra '+L(letras[0])+'.'
  ].filter(Boolean);
}
/* Opções prontas ainda não usadas (as escritas pelos jogadores não gastam as prontas). */
function autoOptions(p,n){ const used=new Set(p.hints||[]); return autoHints(p.item).filter(x=>!used.has(x)).slice(0,n||3); }
function revealHint(p,pick){ const opts=autoOptions(p,3); const h=opts.includes(pick)?pick:opts[0]; if(!h) return null; p.hints.push(h); return h; }
/* Palpite aceito sem perguntar ao dono: igual ao nome ou apelido, sem plural, sem espaços e
   com 1 letra trocada (nomes de 8+ letras) ou 2 (nomes de 12+ letras). */
function lev(a,b){
  let prev=Array.from({length:b.length+1},(_,j)=>j);
  for(let i=1;i<=a.length;i++){ const cur=[i]; for(let j=1;j<=b.length;j++) cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1)); prev=cur; }
  return prev[b.length];
}
function guessKey(s){ return norm(s).split(' ').map(w=>w.length>3?w.replace(/s$/,''):w).join(''); }
function guessMatches(g,names){
  const a=guessKey(g); if(!a) return false;
  return names.some(n=>{ const b=guessKey(n); if(!b) return false; const tol=b.length>=12?2:b.length>=8?1:0; return a===b||lev(a,b)<=tol; });
}
/* A dica não pode entregar o nome do item. */
function hintGivesAway(text,item){ const t=' '+norm(text)+' '; return [item.n].concat(item.a||[]).some(x=>{ const k=norm(x); return k&&t.includes(' '+k+' '); }); }
function findItem(pid,t,ok,e){
  if(ok){
    t.alive=false; t.foundBy=pid; P(pid).score++;
    e.ok=true; e.item=t.item.n;
    if(!checkEnd()) nextTurn();
    return;
  }
  e.ok=false;
  const me=P(pid);
  if(me.alive){   // Dica Forçada: quem errou dá uma dica sobre o próprio item
    const f=addLog({k:'forced',from:pid,to:pid,text:null});
    S.pending={kind:'forced',from:pid,to:pid,logId:f.id};
  } else nextTurn();
}
function nextTurn(){ const n=S.players.length; let i=S.turn; for(let k=0;k<n;k++){ i=(i+1)%n; if(S.players[i].online) break; } S.turn=i; }
function checkEnd(){
  const alive=S.players.filter(p=>p.alive).length;
  if(alive>aliveLimit()) return false;
  S.phase='over'; S.pending=null;
  const max=Math.max(...S.players.map(p=>p.score));
  const w=S.players.filter(p=>p.score===max);
  addLog({k:'sys',text: w.length>1 ? 'Fim de jogo! Empate entre '+w.map(p=>p.name).join(', ')+'.' : 'Fim de jogo! '+w[0].name+' venceu com '+max+' ponto'+(max===1?'':'s')+'.'});
  return true;
}
/* Aplica uma ação de um jogador. Devolve uma mensagem de erro ou null. */
function act(pid,m){
  const me=P(pid); if(!me) return 'Jogador não encontrado.';
  const host = pid===S.hostPid;
  switch(m.a){
    case 'photo': {
      const d=String(m.data||'');
      if(d && !(/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(d) && d.length<=90000)) return 'Foto inválida.';
      S.photos=S.photos||{};
      if(d) S.photos[pid]=d; else delete S.photos[pid];
      S.photoV=(S.photoV||0)+1; return null; }
    case 'cat':   if(host && S.phase!=='playing' && (m.cat==='mix'||CATS[m.cat])) S.category=m.cat; return null;
    case 'level': if(host && S.phase!=='playing' && LEVELS[m.level]) S.level=m.level; return null;
    case 'start': if(!host) return 'Só quem criou a sala pode começar.';
                  if(S.players.length<2) return 'Precisa de pelo menos 2 jogadores.';
                  if(!Array.isArray(m.picks)||m.picks.length<S.players.length) return 'Não consegui sortear os itens.';
                  startGame(m.picks); return null;
    case 'lobby': if(host){ S.phase='lobby'; S.pending=null; S.players=S.players.filter(p=>p.online||p.pid===S.hostPid); } return null;
    case 'skip':  if(!host||S.phase!=='playing') return null;
                  if(S.pending){
                    // Quem travou foi quem devia responder: resolve o pedido do jeito mais neutro.
                    const pd=S.pending, e=S.log.find(x=>x.id===pd.logId), owner=P(pd.to); S.pending=null;
                    addLog({k:'sys',text:owner.name+' não respondeu a tempo.'});
                    if(e&&pd.kind==='guess') e.ok='skip';
                    else if(e&&(pd.kind==='hint'||pd.kind==='forced')){ e.text=revealHint(owner)||''; e.auto=true; }
                    else if(e) e.ans='skip';
                  } else addLog({k:'sys',text:'A vez de '+S.players[S.turn].name+' foi pulada.'});
                  nextTurn(); return null;
  }
  if(S.phase!=='playing') return 'A partida não está em andamento.';
  const pd=S.pending;
  if(m.a==='answer'){
    if(!pd||(pd.kind||'q')!=='q'||pd.to!==pid) return 'Não há pergunta para você responder.';
    if(!['sim','nao','naosei'].includes(m.ans)) return 'Resposta inválida.';
    const e=S.log.find(x=>x.id===pd.logId); if(e) e.ans=m.ans;
    S.pending=null; nextTurn(); return null;
  }
  if(m.a==='givehint'){
    if(!pd||(pd.kind!=='hint'&&pd.kind!=='forced')||pd.to!==pid) return 'Ninguém pediu dica para você agora.';
    const e=S.log.find(x=>x.id===pd.logId);
    let text;
    if(m.auto){ text=revealHint(me,m.pick); if(!text) return 'Acabaram as dicas prontas. Escreva uma dica.'; }
    else{
      text=String(m.text||'').trim().slice(0,120);
      if(text.length<3) return 'Escreva uma dica.';
      if(hintGivesAway(text,me.item)) return 'A dica não pode ter o nome do item!';
      me.hints.push(text);
    }
    if(e){ e.text=text; e.auto=!!m.auto; }
    S.pending=null; nextTurn(); return null;
  }
  if(m.a==='judge'){
    if(!pd||pd.kind!=='guess'||pd.to!==pid) return 'Não há palpite para você conferir.';
    const e=S.log.find(x=>x.id===pd.logId); S.pending=null;
    if(e) e.judged=true;
    findItem(pd.from,me,!!m.ok,e||{}); return null;
  }
  if(S.players[S.turn].pid!==pid) return 'Não é a sua vez.';
  if(pd) return 'Aguarde a resposta de '+P(pd.to).name+'.';
  const t=P(m.to);
  if(!t||t.pid===pid||!t.alive) return 'Escolha um oponente que ainda está em jogo.';
  if(m.a==='ask'){
    const text=String(m.text||'').trim().slice(0,140); if(!text) return 'Escolha ou escreva uma pergunta.';
    const e=addLog({k:'q',from:pid,to:t.pid,text,ans:null});
    S.pending={kind:'q',from:pid,to:t.pid,logId:e.id}; return null;
  }
  if(m.a==='hint'){
    // O dono do item escreve a dica (ou escolhe uma pronta).
    if(me.hintsUsed>=MAX_HINTS) return 'Você já usou suas '+MAX_HINTS+' dicas.';
    me.hintsUsed++;
    const e=addLog({k:'hint',from:pid,to:t.pid,text:null});
    S.pending={kind:'hint',from:pid,to:t.pid,logId:e.id}; return null;
  }
  if(m.a==='guess'){
    const g=String(m.text||'').trim().slice(0,60); if(!g) return 'Escreva seu palpite.';
    const e=addLog({k:'guess',from:pid,to:t.pid,text:g,ok:null});
    if(guessMatches(g,[t.item.n].concat(t.item.a||[]))){ findItem(pid,t,true,e); return null; }
    // Não bateu com o nome: o dono confere se valeu (escrita diferente, sinônimo…).
    S.pending={kind:'guess',from:pid,to:t.pid,logId:e.id}; return null;
  }
  return 'Ação desconhecida.';
}
/* O que cada jogador pode ver: itens dos outros ficam ocultos até serem descobertos. */
function viewFor(pid){
  const over=S.phase==='over';
  return Object.assign({},S,{me:pid,photos:undefined,players:S.players.map(p=>Object.assign({},p,{item:(p.pid===pid||!p.alive||over)?p.item:null}))});
}

/* Sons gerados na hora (Web Audio, sem arquivos) e vibração. Cada aparelho escolhe o que quer receber. */
const AVISO_MODOS = {som:'🔊 Som', vibrar:'📳 Vibrar', ambos:'🔊📳 Som e vibrar', mudo:'🔇 Silêncio'};
const AVISO_TIPOS = {resp:'Respostas (Sim, Não, Não sei)', vez:'Sua vez e pedidos para você', jogo:'Acertos, erros e dicas'};

const SONS = {   // [frequência Hz, duração s] tocadas em sequência; tipo da onda; padrão de vibração (ms)
  sim:   {t:'resp', w:'sine',     n:[[660,.12],[880,.18]],                 v:[60]},
  nao:   {t:'resp', w:'triangle', n:[[330,.14],[247,.22]],                 v:[60,60,60]},
  naosei:{t:'resp', w:'sine',     n:[[523,.1],[494,.1],[523,.16]],         v:[30,40,30]},
  vez:   {t:'vez',  w:'sine',     n:[[784,.12],[1047,.22]],                v:[120,80,120]},
  pedido:{t:'vez',  w:'sine',     n:[[988,.08],[988,.08],[1319,.18]],      v:[200]},
  acerto:{t:'jogo', w:'square',   n:[[523,.1],[659,.1],[784,.1],[1047,.3]],v:[80,50,80,50,200]},
  erro:  {t:'jogo', w:'sawtooth', n:[[220,.18],[175,.3]],                  v:[300]},
  dica:  {t:'jogo', w:'sine',     n:[[1319,.06],[1568,.06],[2093,.14]],    v:[40]}
};
let audioCtx=null, audioAt=0;
function unlockAudio(){
  try{ if(!audioCtx){ const C=window.AudioContext||window.webkitAudioContext; if(C) audioCtx=new C(); } if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }catch(e){}
}
// O navegador só libera o som depois de um toque na tela.
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('keydown',unlockAudio);
function aviso(nome,force){
  const s=SONS[nome]; if(!s) return;
  if(!force&&(avisos.modo==='mudo'||!avisos[s.t])) return;
  if(avisos.modo==='vibrar'||avisos.modo==='ambos'){ try{ if(navigator.vibrate) navigator.vibrate(s.v); }catch(e){} }
  if(avisos.modo==='vibrar'||avisos.modo==='mudo'||!audioCtx) return;
  try{
    let t=Math.max(audioCtx.currentTime+.02,audioAt);
    for(const [f,d] of s.n){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.type=s.w; o.frequency.value=f; o.connect(g); g.connect(audioCtx.destination);
      const vol=s.w==='sine'?.25:.12;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.start(t); o.stop(t+d+.02); t+=d*.9;
    }
    audioAt=t+.08;
  }catch(e){}
}
function feedbackTest(){ ['sim','vez','acerto'].forEach(n=>aviso(n,true)); if(avisos.modo==='mudo') toast('Modo silêncio: nada vai tocar nem vibrar.'); }
/* Compara o que a tela mostrava com o novo estado e toca os avisos do que mudou. */
let fbMemo=null;
function memoOf(v){
  const log={}; for(const e of v.log||[]) log[e.id]={ans:e.ans,ok:e.ok,text:e.text};
  const cur=v.players&&v.players[v.turn];
  return {log, maxId:(v.log&&v.log.length)?v.log[v.log.length-1].id:0,
    mine:v.phase==='playing'&&!v.pending&&!!cur&&cur.pid===v.me,
    pend:v.pending&&v.pending.to===v.me&&v.pending.kind!=='forced'?v.pending.logId:null};
}
function feedback(v){
  if(!v) return;
  const m=memoOf(v), old=fbMemo; fbMemo=m;
  if(!old) return;   // primeira tela (entrou ou reconectou): sem barulho
  for(const e of v.log||[]){
    const p=old.log[e.id]; if(!p&&e.id<=old.maxId) continue;
    const was=p||{};
    if(e.k==='q'&&e.ans&&e.ans!=='skip'&&!was.ans){ aviso(e.ans); fxStamp(e.ans,{sim:'SIM!',nao:'NÃO!',naosei:'NÃO SEI'}[e.ans],'“'+e.text+'”'); }
    if(e.k==='guess'&&(e.ok===true||e.ok===false)&&was.ok!==e.ok){ aviso(e.ok?'acerto':'erro'); if(e.ok) fxParty(e); else fxStamp('erro','ERROU!','“'+e.text+'” não é o item de '+nameOf(e.to)); }
    if((e.k==='hint'||e.k==='forced')&&e.text&&!was.text){ aviso('dica'); fxStamp('dica','💡 DICA',e.text); }
  }
  if(m.pend&&m.pend!==old.pend) aviso('pedido');
  else if(m.mine&&!old.mine) aviso('vez');
}

function resizePhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type)) return rej();
    const url=URL.createObjectURL(file); const img=new Image();
    img.onload=()=>{
      const w=img.naturalWidth,h=img.naturalHeight,s=Math.min(w,h); const c=document.createElement('canvas'); c.width=c.height=160;
      c.getContext('2d').drawImage(img,(w-s)/2,(h-s)/2,s,s,0,0,160,160); URL.revokeObjectURL(url);
      let q=.82, d=c.toDataURL('image/jpeg',q); while(d.length>80000&&q>.3){ q-=.15; d=c.toDataURL('image/jpeg',q); }
      res(d);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(); };
    img.src=url;
  });
}

/* ------------------------------- rede ------------------------------- */
function peerMissing(){ if(typeof Peer==='undefined'){ failHome('Não consegui carregar a conexão. Verifique a internet e recarregue a página.'); return true; } return false; }

function hostRoom(code,restored){
  if(peerMissing()) return;
  isHost=true; mode='connecting'; ui.connMsg=restored?'Recuperando a sala…':'Criando a sala…'; render();
  let tries=0;
  const open=()=>{
    peer=new Peer(PEER_PREFIX+code,{debug:0});
    peer.on('open',()=>{
      // O PeerJS dispara 'open' de novo quando volta a falar com o servidor: a sala continua a mesma.
      if(mode==='room') return;
      if(!restored){ S=newState(code,myPid,myName); if(myPhoto){ S.photos[myPid]=myPhoto; S.photoV=1; } }
      roomCode=code; setUrl(code); mode='room'; sync();
    });
    peer.on('connection',conn=>{
      conn.on('data',m=>onHostData(conn,m));
      conn.on('close',()=>onHostClose(conn));
      conn.on('error',()=>onHostClose(conn));
    });
    peer.on('error',err=>{
      // Com a sala já aberta, não derruba ninguém: tick() tenta voltar ao servidor sozinho.
      if(mode==='room') return;
      if(restored){
        // O servidor ainda guarda o código da sala por um tempo depois que a página recarrega.
        peer.destroy();
        if(tries++<30) setTimeout(open,2500); else failHome('Não foi possível recuperar a sala. Crie uma nova.');
      } else if(err.type==='unavailable-id'){ peer.destroy(); hostRoom(genCode(),false); }
      else failHome('Não consegui criar a sala ('+err.type+'). Verifique a internet.');
    });
  };
  open();
}
function onHostData(conn,m){
  if(!S||!m) return;
  const e=conns.get(conn.peer); if(e&&e.conn===conn) e.seen=Date.now();
  if(m.t==='ping') return;
  if(m.t==='join') return onJoin(conn,m);
  if(m.t==='act'){
    const entry=conns.get(conn.peer); if(!entry) return;
    const err=act(entry.pid,m); if(err) conn.send({t:'toast',msg:err});
    sync();
  }
}
function onJoin(conn,m){
  const name=String(m.name||'').trim().slice(0,20)||'Jogador';
  const pid=String(m.pid||'').slice(0,64); if(!pid) return;
  let p=P(pid);
  if(p){ p.online=true; p.name=name; }
  else{
    if(S.phase!=='lobby'){ conn.send({t:'toast',msg:'A partida já começou. Espere a próxima rodada!',fatal:true}); setTimeout(()=>conn.close(),600); return; }
    if(S.players.length>=MAX_PLAYERS){ conn.send({t:'toast',msg:'A sala está cheia (máximo de 4 jogadores).',fatal:true}); setTimeout(()=>conn.close(),600); return; }
    p=mkPlayer(pid,name,freeColor()); S.players.push(p);
  }
  if(typeof m.photo==='string') act(pid,{a:'photo',data:m.photo});
  const old=conns.get(conn.peer);
  conns.set(conn.peer,{conn,pid,pv:-1,seen:Date.now()});
  if(old&&old.conn!==conn){ try{ old.conn.close(); }catch(e){} }
  sync();
}
function onHostClose(conn){
  const entry=conns.get(conn.peer); if(!entry||entry.conn!==conn) return;
  conns.delete(conn.peer);
  const still=[...conns.values()].some(e=>e.pid===entry.pid);
  const p=P(entry.pid);
  if(p&&!still){
    p.online=false;
    if(S.phase==='lobby') S.players=S.players.filter(x=>x.pid!==p.pid);
  }
  sync();
}
function sync(){
  if(!isHost||!S) return;
  store.set('adv-host',{S,myPid});
  for(const e of conns.values()){
    try{
      if(!e.conn.open) continue;
      if(e.pv!==S.photoV){ e.conn.send({t:'photos',map:S.photos||{}}); e.pv=S.photoV; }
      e.conn.send({t:'state',v:viewFor(e.pid)});
    }catch(err){}
  }
  V=viewFor(myPid); feedback(V); render();
}

function joinRoom(code){
  if(peerMissing()) return;
  isHost=false; roomCode=code; mode='connecting'; ui.connMsg='Entrando na sala '+code+'…'; render();
  peer=new Peer({debug:0});
  joinFails=0; lastSeen=Date.now();
  peer.on('open',()=>{ if(!hostConn) connectHost(code); });
  peer.on('error',err=>{
    if(err.type==='peer-unavailable'){
      // Na primeira entrada é código errado; no meio da partida, o anfitrião só sumiu por um tempo.
      if(!V) failHome('Sala '+code+' não encontrada. Confira o link ou peça um novo para quem criou a sala.');
      else connAt=0;
    }
    else if(mode==='connecting'&&!peer.open) failHome('Não consegui entrar ('+err.type+'). Verifique a internet.');
  });
}
function connectHost(code){
  if(!peer||peer.destroyed) return;
  if(hostConn){ try{ hostConn.close(); }catch(e){} }
  const c=peer.connect(PEER_PREFIX+code,{reliable:true});
  hostConn=c; connAt=Date.now();
  c.on('open',()=>c.send({t:'join',pid:myPid,name:myName,photo:myPhoto}));
  c.on('data',m=>{
    if(!m||hostConn!==c) return;
    lastSeen=Date.now();
    if(m.t==='photos'){ PHOTOS=m.map||{}; if(V) render(); }
    else if(m.t==='state'){ V=m.v; feedback(V); mode='room'; ui.err=''; joinFails=0; tabRoom.set(code); render(); }
    else if(m.t==='toast'){ if(m.fatal) failHome(m.msg); else toast(m.msg); }
  });
  c.on('close',()=>{ if(hostConn===c) connAt=0; });
}
/* Relógio da conexão (a cada 2 s): sinal de vida, quedas silenciosas, conexões travadas e o servidor do PeerJS. */
const PING_MS=2000, DEAD_MS=10000, CONNECT_MS=8000, GIVEUP_MS=180000;
let connAt=0, lastSeen=0, joinFails=0, srvTry=0, linkOk=true;
function tick(){
  if(mode==='home'||!peer||peer.destroyed) return;
  const now=Date.now();
  // Perdeu o servidor de sinalização: as conexões abertas continuam; só tenta voltar de tempos em tempos.
  if(peer.disconnected&&now-srvTry>3000){ srvTry=now; try{ peer.reconnect(); }catch(e){} }
  if(isHost){
    if(!S) return;
    for(const e of [...conns.values()]){
      if(!e.conn.open||now-e.seen>DEAD_MS){ try{ e.conn.close(); }catch(err){} onHostClose(e.conn); }
      else{ try{ e.conn.send({t:'ping'}); }catch(err){} }
    }
    return;
  }
  const alive=!!(hostConn&&hostConn.open&&now-lastSeen<DEAD_MS);
  if(alive!==linkOk){ linkOk=alive; renderTopbar(); }
  if(hostConn&&hostConn.open){ try{ hostConn.send({t:'ping'}); }catch(e){} }
  if(alive||(hostConn&&connAt&&now-connAt<CONNECT_MS)) return;
  // Conexão caiu, travou ou nunca abriu: tenta de novo.
  if(mode==='room'&&now-lastSeen>GIVEUP_MS) return failHome('A sala não responde há alguns minutos. Peça um novo link para quem criou a sala.');
  if(!peer.open) return;
  if(mode==='connecting'&&++joinFails>=3) return failHome('Não consegui falar com a sala. Tente colocar todos no mesmo Wi-Fi.');
  connectHost(roomCode);
}
setInterval(tick,PING_MS);
function send(m){
  if(isHost){ const err=act(myPid,m); if(err) toast(err); sync(); }
  else if(hostConn&&hostConn.open) hostConn.send(Object.assign({t:'act'},m));
  else toast('Sem conexão com a sala. Aguarde um instante…');
}
function teardown(){
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; hostConn=null; conns.clear(); V=null; linkOk=true; tabRoom.set(''); fbMemo=null;
}
function failHome(msg){ teardown(); if(isHost){ S=null; } isHost=false; mode='home'; ui.err=msg||''; render(); }
function leaveRoom(){
  if(isHost && !confirm('Se você sair, a sala será encerrada para todos. Sair mesmo?')) return;
  if(isHost) store.del('adv-host');
  teardown(); S=null; isHost=false; roomCode=''; setUrl(''); mode='home'; ui.err=''; render();
}

const ANS={sim:'Sim',nao:'Não',naosei:'Não sei',skip:'Sem resposta'};
/* Histórico em conversa: quem pergunta fala à esquerda, quem responde à direita, na cor de cada um. */
function bubble(pid,html,cls,right){
  const p=pl(pid)||{color:0,pid:pid};
  return `<div class="msg ${right?'r':''}" style="--pc:${COLORS[p.color]||COLORS[0]}">${p.name!=null?avatar(p):''}<div class="bub ${cls||''}">${html}</div></div>`;
}
function logLine(e,inline){
  const n=pid=>`<b>${esc(pid===V.me?'Você':nameOf(pid))}</b>`;
  const who=(a,b)=>`<span class="who">${esc(a===V.me?'Você':nameOf(a))} → ${esc(b===V.me?'você':nameOf(b))}</span>`;
  switch(e.k){
    case 'sys':  return `<li class="mid"><span class="sys">${esc(e.text)}</span></li>`;
    case 'q':    return `<li>${bubble(e.from,who(e.from,e.to)+'❓ '+esc(e.text))}${bubble(e.to,e.ans?ANS[e.ans]:'pensando…','ans '+(e.ans||'wait'),true)}</li>`;
    // Fora do filtro, o texto da dica fica só no cartão do jogador, para não aparecer repetido.
    case 'hint':
      if(e.text==null) return `<li>${bubble(e.from,who(e.from,e.to)+'💡 Me dá uma dica?')}${bubble(e.to,'escrevendo…','ans wait',true)}</li>`;
      return `<li>${bubble(e.from,who(e.from,e.to)+'💡 Me dá uma dica?')}${bubble(e.to,(e.auto?'🤖 ':'✍️ ')+(inline&&e.text?'“'+esc(e.text)+'”':e.text===''?'Não havia mais dicas.':'Dei uma dica! Toque em '+n(e.to)+' acima para ver.'),'',true)}</li>`;
    case 'forced':
      if(e.text==null) return `<li class="mid"><span class="note2 hint">⚠️ Dica Forçada: ${n(e.from)} está escrevendo uma dica sobre o próprio item…</span></li>`;
      return `<li class="mid"><span class="note2 hint">⚠️ Dica Forçada: ${n(e.from)} deu uma dica sobre o próprio item${inline&&e.text?`: “${esc(e.text)}”`:e.text===''?', mas não havia mais dicas.':' (toque no nome acima para ver).'}</span></li>`;
    case 'guess': {
      const q=bubble(e.from,who(e.from,e.to)+'🎯 É “'+esc(e.text)+'”?');
      if(e.ok===true) return `<li>${q}${bubble(e.to,'Acertou! ✅'+(e.judged?' (confirmado)':''),'ans sim',true)}<span class="note2 good" style="align-self:center">🎉 ${n(e.from)} descobriu: <b>${esc(e.item)}</b> · +1 ponto</span></li>`;
      if(e.ok===false) return `<li>${q}${bubble(e.to,'Errou ❌','ans nao',true)}</li>`;
      if(e.ok==='skip') return `<li>${q}${bubble(e.to,'Sem resposta','ans skip',true)}</li>`;
      return `<li>${q}${bubble(e.to,'conferindo…','ans wait',true)}</li>`; }
  }
  return '';
}
/* De qual item a jogada fala: perguntas, dicas e palpites são sobre o item de "to"; a Dica Forçada, sobre o de "from". */
function aboutOf(e){ return e.k==='forced'?e.from:(e.k==='sys'?null:e.to); }
const HIST_MAX=12;
function historyHtml(){
  if(!V.players.some(p=>p.pid===ui.hist)) ui.hist='all';
  const f=ui.hist, all=f==='all';
  const list=V.log.filter(e=>all||aboutOf(e)===f).reverse();
  const count=pid=>V.log.filter(e=>aboutOf(e)===pid).length;
  const chips=`<div class="chips hchips" role="tablist">
    <button class="chip ${all?'on':''}" style="--pc:var(--accent)" data-hist="all">📜 Tudo</button>
    ${V.players.map(p=>`<button class="chip ${f===p.pid?'on':''}" style="--pc:${COLORS[p.color]}" data-hist="${esc(p.pid)}">${AVATARS[p.color]} ${p.pid===V.me?'Você':esc(p.name)} <small>${count(p.pid)}</small></button>`).join('')}</div>`;
  const shown=ui.histAll?list:list.slice(0,HIST_MAX);
  const p=all?null:pl(f);
  const head=p?`<p class="note" style="margin:0 0 8px">Tudo o que já se sabe sobre o item de <b>${p.pid===V.me?'você':esc(p.name)}</b> (${catLabel(p.cat)}).</p>`:'';
  return `<section class="card"><h2>Histórico</h2>${chips}${head}
    ${shown.length?`<ul class="chat">${shown.map(e=>logLine(e,!all)).join('')}</ul>`:'<p class="muted small">Nada por aqui ainda.</p>'}
    ${list.length>shown.length?`<button class="btn sm ghost" style="margin-top:8px;width:100%" data-histall="1">Ver tudo (${list.length})</button>`:''}</section>`;
}
/* Cartão para quem precisa responder algo: pergunta, pedido de dica, Dica Forçada ou conferir palpite. */
function pendingCard(pend,me){
  const e=V.log.find(x=>x.id===pend.logId)||{};
  const from=esc(nameOf(pend.from)), item=`<b>${esc(me.item.n)}</b>`;
  if(pend.kind==='guess') return `<section class="card answer"><div class="eyebrow">${from} deu um palpite sobre o seu item</div>
      <div class="qtext">“${esc(e.text)}”</div>
      <p class="note">Seu item é ${item}. O palpite está certo, mesmo escrito de outro jeito?</p>
      <div class="ansrow two"><button class="btn yes" data-judge="1">Sim, acertou!</button><button class="btn no" data-judge="0">Não, errou</button></div></section>`;
  if(pend.kind==='hint'||pend.kind==='forced'){
    const opts=autoOptions(me,3);
    return `<section class="card answer"><div class="eyebrow">${pend.kind==='forced'?'Você errou o palpite: Dica Forçada':from+' pediu uma dica'}</div>
      <p style="margin:6px 0 10px">Escreva uma dica sobre o seu item (${item}). Todos vão ver. Não vale escrever o nome!</p>
      <div class="stack"><input id="hinttext" data-keep="hinttext" maxlength="120" autocomplete="off" placeholder="Ex.: Tem na casa da vovó" data-enter="givehint">
        <button class="btn primary big" data-do="givehint">✍️ Enviar minha dica</button></div>
      <div class="eyebrow" style="margin-top:14px">Ou toque numa dica pronta</div>
      ${opts.length?`<div class="stack autoh">${opts.map(o=>`<button class="btn" data-autohint="${esc(o)}">🤖 ${esc(o)}</button>`).join('')}</div>`
        :'<p class="note">As dicas prontas deste item acabaram. Escreva a sua.</p>'}</section>`;
  }
  return `<section class="card answer"><div class="eyebrow">${from} perguntou para você</div>
      <div class="qtext">“${esc(e.text)}”</div>
      <p class="note">Lembrete: seu item é ${item}.</p>
      <div class="ansrow"><button class="btn yes" data-ans="sim">Sim</button><button class="btn no" data-ans="nao">Não</button><button class="btn maybe" data-ans="naosei">Não sei</button></div></section>`;
}
/* Placar fixo no topo. Quem precisa agir agora (quem joga ou quem tem que responder) pulsa.
   A barra de tempo é só visual: esvazia em 1 minuto e não pula ninguém. */
const TURN_SECS=60;
let actKey='', actAt=0;
function actor(){ return V.pending?V.pending.to:(V.players[V.turn]||{}).pid; }
function boardHtml(){
  const who=actor(), p=pl(who); if(!p) return '';
  const key=V.round+':'+V.turn+':'+(V.pending?V.pending.logId:'');
  if(key!==actKey){ actKey=key; actAt=Date.now(); }
  const el=(Date.now()-actAt)/1000;
  const msg=V.pending
    ? (who===V.me?'Responda!':esc(p.name)+' está respondendo…')
    : (who===V.me?'Sua vez!':'Vez de '+esc(p.name));
  return `<div class="board"><div class="seats">${V.players.map(s=>`
    <div class="seat ${s.pid===who?'on':''} ${s.alive?'':'out'} ${s.online?'':'off'}" style="--pc:${COLORS[s.color]}">
      ${avatar(s)}<span class="nm">${s.pid===V.me?'Você':esc(s.name)}</span><span class="pt">⭐ ${s.score}</span></div>`).join('')}</div>
    <div class="timer" style="--pc:${COLORS[p.color]}"><i style="animation-delay:-${el.toFixed(1)}s"></i></div>
    <div class="tstat"><span style="color:${COLORS[p.color]}">${msg}${p.online?'':' (offline)'}</span><span id="clock">${clockText()}</span></div></div>`;
}
function clockText(){ const s=Math.floor((Date.now()-actAt)/1000); return s>=TURN_SECS?'⏰ '+Math.floor(s/60)+':'+String(s%60).padStart(2,'0'):Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
setInterval(()=>{ const c=$('#clock'); if(c) c.textContent=clockText(); },1000);
function renderGame(){
  const me=pl(V.me); const cur=V.players[V.turn]; const host=V.hostPid===V.me;
  const myTurn=cur&&cur.pid===V.me; const pend=V.pending;
  let top='';
  if(pend&&pend.to===V.me){
    top=pendingCard(pend,me);
  } else if(pend){
    const who=`<b>${esc(nameOf(pend.to))}</b>`, from=esc(nameOf(pend.from));
    const what={hint:`está escrevendo uma dica para ${from}…`,forced:`errou o palpite e está escrevendo uma dica sobre o próprio item…`,
      guess:`está conferindo o palpite de ${from}…`}[pend.kind]||`está respondendo à pergunta de ${from}…`;
    top=`<section class="card wait"><div class="dots"></div><div>${who} ${what}</div></section>`;
  } else if(myTurn){
    top=renderActions(me);
  }
  const bar=boardHtml();
  const tools=host?`<section class="card"><div class="eyebrow">Controles do anfitrião</div><div class="row" style="margin-top:8px">
      <button class="btn sm" data-do="skip">⏭️ Pular a vez de ${esc(cur?cur.name:'')}</button>
      <button class="btn sm ghost" data-do="lobby">Encerrar partida</button></div>
      <p class="note">Use “pular” se alguém saiu ou travou.</p></section>`:'';
  return bar+(me?secretCard(me):'')+top+playersHtml()+historyHtml()+tools;
}
function renderOver(){
  const host=V.hostPid===V.me;
  const max=Math.max(...V.players.map(p=>p.score));
  const winners=V.players.filter(p=>p.score===max);
  const ranked=V.players.slice().sort((a,b)=>b.score-a.score);
  return `<section class="card center"><div class="trophy">🏆</div>
    <h1>${winners.length>1?'Empate!':esc(winners[0].name)+' venceu!'}</h1>
    <p class="muted">${winners.length>1?winners.map(w=>esc(w.name)).join(', ')+' terminaram com '+max+' ponto'+(max===1?'':'s')+'.':'Com '+max+' ponto'+(max===1?'':'s')+'.'}</p>
    <ul class="rank" style="margin-top:14px;text-align:left">${ranked.map(p=>`<li class="${p.score===max?'win':''}">${avatar(p)}<b style="flex:1">${esc(p.name)}</b><span class="small muted">${esc(p.item?p.item.n:'')}</span><span class="score">⭐ ${p.score}</span></li>`).join('')}</ul>
    ${host?`<button class="btn primary big" style="margin-top:14px" data-do="start">Jogar de novo</button>
      <button class="btn ghost" style="margin-top:8px" data-do="lobby">Voltar para a sala de espera</button>`
      :`<p class="muted" style="margin-top:14px">Aguardando ${esc(nameOf(V.hostPid))} começar outra partida…</p>`}
  </section>${playersHtml()}${historyHtml()}`;
}
function renderTopbar(){
  const tb=$('#topbar');
  if(mode!=='room'||!V){ tb.hidden=true; return; }
  tb.hidden=false;
  tb.innerHTML=`<div class="brand">❓ Adivinha<span class="long"> o que é</span></div><div class="row">${!isHost&&!linkOk?'<span class="tag off">Reconectando…</span>':''}<span class="tag" title="Código da sala">${esc(V.code)}</span><button class="btn ghost sm" data-do="avisos" aria-label="Avisos" title="Avisos">${AVISO_MODOS[avisos.modo].split(' ')[0]}</button><button class="btn ghost sm" data-do="leave">Sair</button></div>`;
}
function render(){
  const saved={}; let focusKey=null, sel=null;
  document.querySelectorAll('[data-keep]').forEach(el=>{
    saved[el.dataset.keep]=el.value;
    if(el===document.activeElement){ focusKey=el.dataset.keep; try{ sel=[el.selectionStart,el.selectionEnd]; }catch(e){} }
  });
  let html='';
  if(mode==='home') html=renderHome();
  else if(mode==='connecting') html=renderConnecting();
  else if(V&&V.phase==='lobby') html=renderLobby();
  else if(V&&V.phase==='playing') html=renderGame();
  else if(V&&V.phase==='over') html=renderOver();
  if(ui.avisos&&mode==='room') html=avisosHtml()+html;
  app.innerHTML=html;
  renderTopbar();
  document.querySelectorAll('[data-keep]').forEach(el=>{
    const k=el.dataset.keep;
    if(saved[k]!==undefined) el.value=saved[k];
    if(k===focusKey){ el.focus(); try{ if(sel) el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
  });
  fillSugs(); fillGuessList();
  const q=$('#qr');
  if(q&&typeof qrcode!=='undefined'){ try{ const g=qrcode(0,'M'); g.addData(shareUrl()); g.make(); q.innerHTML=g.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){ q.remove(); } }
  else if(q) q.remove();
}

/* Sorteia os itens da partida (só o anfitrião) e começa. */
let preparing=false;
async function prepararItens(){
  if(!isHost||!S||preparing) return;
  const n=S.players.length; if(n<2) return toast('Precisa de pelo menos 2 jogadores.');
  const keys=Object.keys(CATS); if(!keys.length) return toast('Não encontrei as categorias. Confira se a pasta "itens" foi publicada.');
  const cats=S.category==='mix' ? shuffle(keys.slice()).slice(0,n) : Array(n).fill(S.category);
  preparing=true; toast('Sorteando os itens…');
  try{
    const lists=await Promise.all([...new Set(cats)].map(c=>loadCat(c).then(l=>[c,l])));
    const byCat=Object.fromEntries(lists); const used=new Set(); const picks=[];
    for(const c of cats){
      const all=byCat[c]; let pool=all.filter(i=>S.level==='fm'?(i.d==='f'||i.d==='m'):i.d===S.level);
      pool=pool.filter(i=>!used.has(i.n)); if(!pool.length) pool=all.filter(i=>!used.has(i.n));
      const it=pool[Math.floor(Math.random()*pool.length)]; used.add(it.n);
      picks.push({n:it.n,h:it.h,a:it.a||[],cat:c});
    }
    send({a:'start',picks:shuffle(picks)});
  }catch(e){ toast('Não consegui carregar os itens. Verifique a internet e tente de novo.'); }
  finally{ preparing=false; }
}
/* Sugestões do palpite: nomes da categoria do oponente (baixados sob demanda). */
function fillGuessList(){
  const dl=$('#itemlist'); if(!dl||!V) return;
  const t=pl(ui.target); if(!t||!t.cat) return;
  loadCat(t.cat).then(list=>{ const d=$('#itemlist'); if(d&&pl(ui.target)&&pl(ui.target).cat===t.cat) d.innerHTML=list.map(i=>`<option value="${esc(i.n)}"></option>`).join(''); }).catch(()=>{});
}

function fillSugs(){
  const box=$('#sugs'), inp=$('#qtext'); if(!box||!inp||!V) return;
  const t=pl(ui.target); const cat=(t&&t.cat)||'geral';
  const q=norm(inp.value); let items;
  if(q.length>=2){
    const {list,keys}=questionsFor(cat); const terms=q.split(' '); items=[];
    for(let i=0;i<list.length&&items.length<8;i++) if(terms.every(w=>keys[i].includes(w))) items.push(list[i]);
    if(!items.length){ box.innerHTML='<p class="note">Nenhuma pergunta pronta com essas palavras. Pode enviar a sua do jeito que escreveu!</p>'; return; }
  } else items=randomQs(cat);
  box.innerHTML=items.map(x=>`<button class="sug" data-sug="${esc(x)}">${esc(x)}</button>`).join('');
}

/* ------------------------------- eventos ------------------------------- */
function readName(){
  const v=($('#name')?$('#name').value:'').trim().slice(0,20);
  if(!v){ toast('Digite seu nome primeiro.'); $('#name')&&$('#name').focus(); return null; }
  myName=v; store.set('adv-name',v); return v;
}
function doAction(what){
  switch(what){
    case 'create': if(readName()){ ui.err=''; hostRoom(genCode(),false); } break;
    case 'join':   if(readName()){ ui.err=''; joinRoom(roomCode); } break;
    case 'joincode': {
      const c=($('#code').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,6);
      if(c.length<4){ toast('Digite o código da sala (4 letras).'); return; }
      if(readName()){ ui.err=''; setUrl(c); joinRoom(c); } break; }
    case 'forget': roomCode=''; setUrl(''); ui.err=''; render(); break;
    case 'cancel': failHome(''); break;
    case 'leave':  leaveRoom(); break;
    case 'copy': {
      const url=shareUrl();
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast('Link copiado!'),()=>toast('Não deu para copiar. Selecione o link e copie.'));
      else toast('Selecione o link e copie.');
      break; }
    case 'share': navigator.share({title:'Adivinha o que é',text:'Vem jogar comigo! Sala '+roomCode,url:shareUrl()}).catch(()=>{}); break;
    case 'peek': ui.peek=!ui.peek; render(); break;
    case 'shuffleq': { ui.sugSeed++; const i=$('#qtext'); if(i) i.value=''; fillSugs(); break; }
    case 'nophoto': myPhoto=''; store.del('adv-photo'); if(mode==='room') send({a:'photo',data:''}); render(); break;
    case 'start': prepararItens(); break;
    case 'lobby': send({a:what}); break;
    case 'skip': if(confirm('Pular a vez deste jogador?')) send({a:'skip'}); break;
    case 'ask': { const i=$('#qtext'); const text=(i.value||'').trim(); if(!text){ toast('Escolha ou escreva uma pergunta.'); return; } i.value=''; ui.sugSeed++; send({a:'ask',to:ui.target,text}); break; }
    case 'hint': send({a:'hint',to:ui.target}); break;
    case 'givehint': { const i=$('#hinttext'); const text=(i&&i.value||'').trim(); if(text.length<3){ toast('Escreva uma dica.'); return; }
                       if(V&&hintGivesAway(text,pl(V.me).item)){ toast('A dica não pode ter o nome do item!'); return; }
                       i.value=''; send({a:'givehint',text}); break; }
    case 'autohint': send({a:'givehint',auto:true}); break;
    case 'avisos': ui.avisos=!ui.avisos; render(); break;
    case 'testsom': unlockAudio(); feedbackTest(); break;
    case 'guess': { const i=$('#guess'); const text=(i.value||'').trim(); if(!text){ toast('Escreva seu palpite.'); return; } i.value=''; send({a:'guess',to:ui.target,text}); break; }
  }
}
document.addEventListener('click',e=>{
  const sg=e.target.closest('[data-sug]');
  if(sg){ const i=$('#qtext'); if(i){ i.value=sg.dataset.sug; i.focus(); } fillSugs(); return; }
  const b=e.target.closest('[data-do],[data-ans],[data-judge],[data-modo],[data-target],[data-tab],[data-autohint],[data-hist],[data-histall]'); if(!b||b.disabled) return;
  if(b.dataset.do) return doAction(b.dataset.do);
  if(b.dataset.autohint) return send({a:'givehint',auto:true,pick:b.dataset.autohint});
  if(b.dataset.hist){ ui.hist=b.dataset.hist; ui.histAll=false; return render(); }
  if(b.dataset.histall){ ui.histAll=true; return render(); }
  if(b.dataset.ans) return send({a:'answer',ans:b.dataset.ans});
  if(b.dataset.judge) return send({a:'judge',ok:b.dataset.judge==='1'});
  if(b.dataset.modo){ avisos.modo=b.dataset.modo; store.set('adv-avisos',avisos); render(); return; }
  if(b.dataset.target){ ui.target=b.dataset.target; return render(); }
  if(b.dataset.tab){ ui.tab=b.dataset.tab; return render(); }
});
/* Carta secreta: mostra só enquanto o dedo (ou a tecla) estiver segurando. */
let holding=false;
function setHold(on){ holding=on; const f=$('#flip'); if(f) f.classList.toggle('show',on); }
document.addEventListener('pointerdown',e=>{ if(e.target.closest('#flip')){ e.preventDefault(); setHold(true); } });
['pointerup','pointercancel','blur'].forEach(t=>window.addEventListener(t,()=>{ if(holding) setHold(false); }));
document.addEventListener('pointerout',e=>{ if(holding&&e.target.closest&&e.target.closest('#flip')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('#flip'))) setHold(false); });
document.addEventListener('contextmenu',e=>{ if(e.target.closest('#flip')) e.preventDefault(); });
document.addEventListener('keydown',e=>{ if((e.key===' '||e.key==='Enter')&&e.target.id==='flip'){ e.preventDefault(); setHold(true); } });
document.addEventListener('keyup',e=>{ if(e.target.id==='flip') setHold(false); });
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='cat') send({a:'cat',cat:el.value});
  if(el.dataset.change==='level') send({a:'level',level:el.value});
  if(el.dataset.aviso){ avisos[el.dataset.aviso]=el.checked; store.set('adv-avisos',avisos); }
  if(el.matches('[data-photo]')){
    const f=el.files&&el.files[0]; el.value='';
    resizePhoto(f).then(d=>{ myPhoto=d; store.set('adv-photo',d); if(mode==='room') send({a:'photo',data:d}); render(); toast('Foto atualizada!'); })
      .catch(()=>toast('Não consegui usar essa imagem. Tente outra.'));
  }
});
document.addEventListener('input',e=>{ if(e.target.id==='qtext') fillSugs(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const el=e.target;
  if(el.dataset&&el.dataset.enter){ e.preventDefault(); doAction(el.dataset.enter); }
  else if(el.id==='name'){ e.preventDefault(); doAction(roomCode?'join':'create'); }
  else if(el.id==='code'){ e.preventDefault(); doAction('joincode'); }
});

/* ------------------------------- início ------------------------------- */
(function init(){
  const saved=store.get('adv-host');
  if(roomCode&&saved&&saved.S&&saved.S.code===roomCode&&saved.myPid===myPid){
    // O anfitrião recarregou a página: recupera a partida.
    S=saved.S; S.photos=S.photos||{}; S.photoV=(S.photoV||0)+1; S.players.forEach(p=>{ p.online=(p.pid===myPid); });
    hostRoom(roomCode,true);
  } else if(roomCode&&myName&&tabRoom.get()===roomCode){
    // O convidado recarregou a página no meio da sala: entra de novo sem precisar tocar em nada.
    joinRoom(roomCode);
  } else render();
})();
</script>
