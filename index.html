<html lang="pt-BR">
<head>

<title>Adivinha o que é</title>

<style>
:root{
  --bg:#fbf4e8; --card:#ffffff; --ink:#2b2135; --muted:#7a6e85; --line:#eadfcd; --soft:#f6ede0;
  --accent:#ff6b4a; --accent-ink:#ffffff; --ok:#1f9d63; --no:#e5484d; --maybe:#d98a00;
  --shadow:0 2px 0 rgba(43,33,53,.06), 0 8px 24px rgba(43,33,53,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#1c1722; --card:#27202f; --ink:#f4eefa; --muted:#a99cb6; --line:#3a3045; --soft:#2f2738;
    --shadow:0 2px 0 rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.25); color-scheme:dark;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Nunito",system-ui,sans-serif;min-height:100vh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
h1,h2,h3,.code,.qtext{font-family:"Baloo 2","Nunito",sans-serif;line-height:1.1}
h1{font-size:2.2rem;margin:.2em 0}
h2{font-size:1.25rem;margin:0 0 .6em}
main{max-width:640px;margin:0 auto;padding:12px 16px 48px;display:flex;flex-direction:column;gap:14px}
.topbar{max-width:640px;margin:0 auto;padding:14px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{font-family:"Baloo 2",sans-serif;font-weight:800;font-size:1.15rem;display:flex;align-items:center;gap:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow)}
.hero{text-align:center;padding:28px 20px}
.logo{font-size:3rem;line-height:1;display:inline-grid;place-items:center;width:84px;height:84px;border-radius:26px;background:var(--accent);transform:rotate(-6deg);box-shadow:0 6px 0 rgba(0,0,0,.12)}
.muted{color:var(--muted)} .small{font-size:.88rem} .center{text-align:center}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:block;text-align:left;margin:14px 0}
.field>span{display:block;font-weight:800;font-size:.9rem;margin-bottom:6px}
input,select{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:2px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;min-height:48px}
input:focus,select:focus{border-color:var(--accent)}
.btn{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;min-height:46px;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(2px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.big{width:100%;font-size:1.1rem;min-height:56px;margin-top:6px}
.btn.ghost{background:transparent}
.btn.sm{min-height:38px;padding:6px 12px;font-size:.9rem}
.btn.yes{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.no{background:var(--no);border-color:var(--no);color:#fff}
.btn.maybe{background:var(--maybe);border-color:var(--maybe);color:#fff}
.alert{background:rgba(229,72,77,.12);border:1px solid rgba(229,72,77,.4);border-radius:12px;padding:10px 12px;margin:12px 0;text-align:left}
.joincode{margin-top:14px;text-align:left}
.joincode summary{cursor:pointer;color:var(--muted);font-weight:700;text-align:center}
.joincode .row{margin-top:10px;flex-wrap:nowrap}
.joincode input{text-transform:uppercase;letter-spacing:.2em}
.code{font-size:2.4rem;font-weight:800;letter-spacing:.12em;color:var(--accent)}
.share{display:flex;gap:14px;align-items:center;margin-top:10px}
.qr{flex:none;width:132px;height:132px;background:#fff;border-radius:14px;padding:6px;display:grid;place-items:center}
.qr svg{width:100%;height:100%}
.sharebtns{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.link{font-size:.85rem;min-height:40px;padding:8px 10px}
.tag{display:inline-block;font-size:.72rem;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--soft);border:1px solid var(--line);color:var(--muted);margin-left:4px;vertical-align:middle;white-space:nowrap}
.tag.off{color:var(--no)} .tag.spec{color:var(--accent);border-color:var(--accent)}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:var(--soft)}
.av{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--pc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.turnbar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--pc);color:#fff;font-weight:800}
.turnbar .av{background:rgba(255,255,255,.25)}
.secret{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.secret .item{font-family:"Baloo 2",sans-serif;font-size:1.6rem;font-weight:800}
.blur{filter:blur(9px);user-select:none}
.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:16px;margin-bottom:14px}
.tabs button{flex:1;font:inherit;font-weight:800;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 4px;cursor:pointer;min-height:44px}
.tabs button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 12px}
.chip{font:inherit;font-weight:800;border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;cursor:pointer;min-height:44px}
.chip.on{border-color:var(--pc);background:var(--pc);color:#fff}
.chip small{font-weight:600;opacity:.8}
.stack{display:flex;flex-direction:column;gap:10px}
.note{font-size:.88rem;color:var(--muted);margin:2px 0 0}
.answer{border:3px solid var(--accent)}
.qtext{font-size:1.5rem;font-weight:800;margin:8px 0}
.ansrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
.ansrow .btn{min-height:56px;font-size:1.05rem}
.wait{display:flex;align-items:center;gap:10px}
.dots{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.pcard.turn{border-color:var(--pc)}
.pcard.out{opacity:.85}
.phead{display:flex;align-items:center;gap:10px}
.pname{flex:1;min-width:0}
.pname b{word-break:break-word}
.score{font-weight:800;font-size:1.1rem;white-space:nowrap}
.pstatus{margin-top:8px;font-size:.92rem}
.hints{list-style:none;padding:0;margin:8px 0 0;display:flex;flex-direction:column;gap:4px}
.hints li{background:var(--soft);border-radius:10px;padding:6px 10px;font-size:.9rem}
.log{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px;max-height:360px;overflow:auto}
.log li{padding:8px 10px;border-radius:12px;background:var(--soft);font-size:.93rem}
.log li.sys{background:transparent;border:1px dashed var(--line);color:var(--muted);text-align:center}
.badge{display:inline-block;font-size:.78rem;font-weight:800;padding:1px 9px;border-radius:999px;color:#fff;margin-left:4px;white-space:nowrap}
.badge.sim{background:var(--ok)} .badge.nao{background:var(--no)} .badge.naosei{background:var(--maybe)} .badge.wait,.badge.skip{background:var(--muted)}
.rank{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:8px}
.rank li{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:var(--soft)}
.rank li.win{outline:3px solid var(--accent)}
.trophy{font-size:3rem;text-align:center}
details.rules summary{cursor:pointer;font-weight:800;font-family:"Baloo 2",sans-serif;font-size:1.15rem}
details.rules ul{padding-left:20px;margin:10px 0 0} details.rules li{margin:4px 0}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:700;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:.25s;z-index:10;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (max-width:420px){
  .share{flex-direction:column;align-items:stretch}
  .qr{align-self:center}
  h1{font-size:1.9rem}
}
</style>
</head>

  ]},
  objetos:{label:'Objetos',emoji:'🧸',items:[
    {n:'Guarda-chuva',h:['Pode ser dobrado.','Usamos em dias de tempo feio.','Protege da chuva.']},

    {n:'Vela',h:['Pode ter cheiro.','Usamos quando falta luz ou no bolo de aniversário.','Tem pavio e a gente acende.']},
    {n:'Chave',h:['É pequena e de metal.','Costuma ficar num chaveiro.','Abre portas e cadeados.']}
  ]},
  profissoes:{label:'Profissões',emoji:'👩‍🚒',items:[
    {n:'Médico',h:['Trabalha muito em hospital.','Usa jaleco branco.','Usa estetoscópio para ouvir o coração.']},
    {n:'Professor',h:['Trabalha com crianças e jovens.','Usa lousa ou quadro.','Ensina na escola.']},

    {n:'Carteiro',h:['Anda muito pela rua.','Trabalha para os Correios.','Entrega cartas.']}
  ]},
  lugares:{label:'Lugares',emoji:'🏖️',items:[

};

/* Perguntas prontas (o dono do item responde Sim / Não / Não sei) */
const QUESTIONS = [
  'É um ser vivo?','É um animal?','Dá para comer?','É doce?','É salgado?',
  'Cabe na palma da mão?','É maior que uma pessoa?','Tem dentro de casa?','Fica ao ar livre?',
  'Usa eletricidade ou bateria?','É feito de metal?','É feito de plástico?','Tem pernas ou patas?',
  'Voa?','Vive ou fica na água?','É usado na cozinha?','Crianças gostam?','Faz barulho?',
  'É perigoso?','Existe no Brasil?','Tem cor marcante?','Usa uniforme?','Trabalha à noite?',
  'É um lugar fechado?','Dá para visitar?','Fica perto do mar?','Tem a ver com saúde?','Tem a ver com festa?'
];

const COLORS  = ['#ff6b4a','#3b82f6','#1f9d63','#a855f7'];
const AVATARS = ['🦊','🐼','🐸','🦉'];
const MAX_PLAYERS = 4;
const MAX_HINTS = 2;              // dicas que cada jogador pode usar
const PEER_PREFIX = 'adivinha-oqe-v1-';

/* ============================== ENGINE START ============================== */
function allItems(){ const out=[]; for(const [k,c] of Object.entries(BANK)) for(const it of c.items) out.push({n:it.n,h:it.h,cat:k}); return out; }
function poolFor(cat){ return (cat==='mix'||!BANK[cat]) ? allItems() : BANK[cat].items.map(it=>({n:it.n,h:it.h,cat})); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function norm(s){
  return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase()
    .replace(/[^a-z0-9 ]/g,' ').replace(/\b(o|a|os|as|um|uma|de|do|da|dos|das)\b/g,' ')
    .replace(/\s+/g,' ').trim();
}
function mkPlayer(pid,name,color){ return {pid,name,color,online:true,item:null,cat:null,alive:true,score:0,hintsUsed:0,hints:[],foundBy:null}; }
function newState(code,hostPid,hostName){
  return {code,hostPid,phase:'lobby',category:'mix',players:[mkPlayer(hostPid,hostName,0)],turn:0,pending:null,log:[],seq:0,round:0};
}
function P(pid){ return S.players.find(p=>p.pid===pid); }
function freeColor(){ const used=new Set(S.players.map(p=>p.color)); for(let i=0;i<MAX_PLAYERS;i++) if(!used.has(i)) return i; return 0; }
function addLog(e){ e.id=++S.seq; S.log.push(e); if(S.log.length>300) S.log.shift(); return e; }
/* Regra original: termina quando restam 2 itens sem descobrir.
   (Com só 2 jogadores, termina quando resta 1 — senão nem começaria.) */
function aliveLimit(){ return S.players.length>=3 ? 2 : 1; }
function startGame(){
  const pool=shuffle(poolFor(S.category));
  S.players.forEach((p,i)=>{
    const it=pool[i%pool.length];
    Object.assign(p,{item:{n:it.n,h:it.h},cat:it.cat,alive:true,score:0,hintsUsed:0,hints:[],foundBy:null});
  });
  S.phase='playing'; S.pending=null; S.log=[]; S.round++;
  S.turn=Math.floor(Math.random()*S.players.length);
  if(!S.players[S.turn].online) nextTurn();
  addLog({k:'sys',text:'A partida começou! Cada um recebeu um item secreto. '+S.players[S.turn].name+' começa.'});
}
function revealHint(p){ if(!p.item||p.hints.length>=p.item.h.length) return null; const h=p.item.h[p.hints.length]; p.hints.push(h); return h; }
function nextTurn(){ const n=S.players.length; let i=S.turn; for(let k=0;k<n;k++){ i=(i+1)%n; if(S.players[i].online) break; } S.turn=i; }
function checkEnd(){
  const alive=S.players.filter(p=>p.alive).length;
  if(alive>aliveLimit()) return false;
  S.phase='over'; S.pending=null;
  const max=Math.max(...S.players.map(p=>p.score));
  const w=S.players.filter(p=>p.score===max);
  addLog({k:'sys',text: w.length>1 ? 'Fim de jogo! Empate entre '+w.map(p=>p.name).join(', ')+'.' : 'Fim de jogo! '+w[0].name+' venceu com '+max+' ponto'+(max===1?'':'s')+'.'});
  return true;
}
/* Aplica uma ação de um jogador. Devolve uma mensagem de erro ou null. */
function act(pid,m){
  const me=P(pid); if(!me) return 'Jogador não encontrado.';
  const host = pid===S.hostPid;
  switch(m.a){
    case 'cat':   if(host && S.phase!=='playing' && (m.cat==='mix'||BANK[m.cat])) S.category=m.cat; return null;
    case 'start': if(!host) return 'Só quem criou a sala pode começar.';
                  if(S.players.length<2) return 'Precisa de pelo menos 2 jogadores.';
                  startGame(); return null;
    case 'lobby': if(host){ S.phase='lobby'; S.pending=null; S.players=S.players.filter(p=>p.online||p.pid===S.hostPid); } return null;
    case 'skip':  if(!host||S.phase!=='playing') return null;
                  if(S.pending){ const e=S.log.find(x=>x.id===S.pending.logId); if(e) e.ans='skip'; S.pending=null; }
                  addLog({k:'sys',text:'A vez de '+S.players[S.turn].name+' foi pulada.'});
                  nextTurn(); return null;
  }
  if(S.phase!=='playing') return 'A partida não está em andamento.';
  if(m.a==='answer'){
    if(!S.pending||S.pending.to!==pid) return 'Não há pergunta para você responder.';
    if(!['sim','nao','naosei'].includes(m.ans)) return 'Resposta inválida.';
    const e=S.log.find(x=>x.id===S.pending.logId); if(e) e.ans=m.ans;
    S.pending=null; nextTurn(); return null;
  }
  if(S.players[S.turn].pid!==pid) return 'Não é a sua vez.';
  if(S.pending) return 'Aguarde a resposta da pergunta.';
  const t=P(m.to);
  if(!t||t.pid===pid||!t.alive) return 'Escolha um oponente que ainda está em jogo.';
  if(m.a==='ask'){
    const text=String(m.text||'').trim().slice(0,140); if(!text) return 'Escolha ou escreva uma pergunta.';
    const e=addLog({k:'q',from:pid,to:t.pid,text,ans:null});
    S.pending={from:pid,to:t.pid,logId:e.id}; return null;
  }
  if(m.a==='hint'){
    if(me.hintsUsed>=MAX_HINTS) return 'Você já usou suas '+MAX_HINTS+' dicas.';
    const h=revealHint(t); if(!h) return 'Não há mais dicas sobre o item de '+t.name+'.';
    me.hintsUsed++; addLog({k:'hint',from:pid,to:t.pid,text:h}); nextTurn(); return null;
  }
  if(m.a==='guess'){
    const g=String(m.text||'').trim().slice(0,60); if(!g) return 'Escreva seu palpite.';
    if(norm(g)===norm(t.item.n)){
      t.alive=false; t.foundBy=pid; me.score++;
      addLog({k:'guess',from:pid,to:t.pid,text:g,ok:true,item:t.item.n});
      if(!checkEnd()) nextTurn(); return null;
    }
    const e=addLog({k:'guess',from:pid,to:t.pid,text:g,ok:false});
    if(me.alive){ e.penalty = revealHint(me) || ''; }   // Custo de Dica Forçada
    nextTurn(); return null;
  }
  return 'Ação desconhecida.';
}
/* O que cada jogador pode ver: itens dos outros ficam ocultos até serem descobertos. */
function viewFor(pid){
  const over=S.phase==='over';
  return Object.assign({},S,{me:pid,players:S.players.map(p=>Object.assign({},p,{item:(p.pid===pid||!p.alive||over)?p.item:null}))});
}

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),3200); }

/* ------------------------------- rede ------------------------------- */
function peerMissing(){ if(typeof Peer==='undefined'){ failHome('Não consegui carregar a conexão. Verifique a internet e recarregue a página.'); return true; } return false; }

function hostRoom(code,restored){
  if(peerMissing()) return;
  isHost=true; mode='connecting'; ui.connMsg=restored?'Recuperando a sala…':'Criando a sala…'; render();
  let tries=0;
  const open=()=>{
    peer=new Peer(PEER_PREFIX+code,{debug:0});
    peer.on('open',()=>{
      if(!restored) S=newState(code,myPid,myName);
      roomCode=code; setUrl(code); mode='room'; sync();
    });
    peer.on('connection',conn=>{
      conn.on('data',m=>onHostData(conn,m));
      conn.on('close',()=>onHostClose(conn));
      conn.on('error',()=>onHostClose(conn));
    });
    peer.on('error',err=>{
      if(err.type==='unavailable-id'){
        peer.destroy();
        if(restored){ if(tries++<8){ setTimeout(open,2500); } else failHome('Não foi possível recuperar a sala. Crie uma nova.'); }
        else hostRoom(genCode(),false);
      } else if(mode==='connecting'){ failHome('Não consegui criar a sala ('+err.type+'). Verifique a internet.'); }
      else toast('Problema de conexão ('+err.type+').');
    });
    peer.on('disconnected',()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
  };
  open();
}
function onHostData(conn,m){
  if(!S||!m) return;
  if(m.t==='join') return onJoin(conn,m);
  if(m.t==='act'){
    const entry=conns.get(conn.peer); if(!entry) return;
    const err=act(entry.pid,m); if(err) conn.send({t:'toast',msg:err});
    sync();
  }
}
function onJoin(conn,m){
  const name=String(m.name||'').trim().slice(0,20)||'Jogador';
  const pid=String(m.pid||'').slice(0,64); if(!pid) return;
  let p=P(pid);
  if(p){ p.online=true; p.name=name; }
  else{
    if(S.phase!=='lobby'){ conn.send({t:'toast',msg:'A partida já começou. Espere a próxima rodada!',fatal:true}); setTimeout(()=>conn.close(),600); return; }
    if(S.players.length>=MAX_PLAYERS){ conn.send({t:'toast',msg:'A sala está cheia (máximo de 4 jogadores).',fatal:true}); setTimeout(()=>conn.close(),600); return; }
    p=mkPlayer(pid,name,freeColor()); S.players.push(p);
  }
  conns.set(conn.peer,{conn,pid});
  sync();
}
function onHostClose(conn){
  const entry=conns.get(conn.peer); if(!entry) return;
  conns.delete(conn.peer);
  const still=[...conns.values()].some(e=>e.pid===entry.pid);
  const p=P(entry.pid);
  if(p&&!still){
    p.online=false;
    if(S.phase==='lobby') S.players=S.players.filter(x=>x.pid!==p.pid);
  }
  sync();
}
function sync(){
  if(!isHost||!S) return;
  store.set('adv-host',{S,myPid});
  for(const {conn,pid} of conns.values()){ try{ if(conn.open) conn.send({t:'state',v:viewFor(pid)}); }catch(e){} }
  V=viewFor(myPid); render();
}

function joinRoom(code){
  if(peerMissing()) return;
  isHost=false; roomCode=code; mode='connecting'; ui.connMsg='Entrando na sala '+code+'…'; render();
  peer=new Peer({debug:0});
  let retries=0;
  peer.on('open',()=>connectHost(code));
  peer.on('error',err=>{
    if(err.type==='peer-unavailable'){
      if(mode==='room'&&retries++<20){ toast('A sala está fora do ar. Tentando reconectar…'); setTimeout(()=>connectHost(code),3000); }
      else failHome('Sala '+code+' não encontrada. Confira o link ou peça um novo para quem criou a sala.');
    }
    else if(mode==='connecting') failHome('Não consegui entrar ('+err.type+'). Verifique a internet.');
    else toast('Problema de conexão ('+err.type+').');
  });
  peer.on('disconnected',()=>{ try{ if(!peer.destroyed) peer.reconnect(); }catch(e){} });
}
function connectHost(code){
  if(!peer||peer.destroyed) return;
  const c=peer.connect(PEER_PREFIX+code,{reliable:true});
  hostConn=c;
  c.on('open',()=>c.send({t:'join',pid:myPid,name:myName}));
  c.on('data',m=>{
    if(!m) return;
    if(m.t==='state'){ V=m.v; mode='room'; ui.err=''; render(); }
    else if(m.t==='toast'){ if(m.fatal) failHome(m.msg); else toast(m.msg); }
  });
  c.on('close',()=>{
    if(hostConn!==c||mode==='home') return;
    toast('Conexão com a sala perdida. Tentando de novo…');
    setTimeout(()=>{ if(hostConn===c) connectHost(code); },3000);
  });
}
function send(m){
  if(isHost){ const err=act(myPid,m); if(err) toast(err); sync(); }
  else if(hostConn&&hostConn.open) hostConn.send(Object.assign({t:'act'},m));
  else toast('Sem conexão com a sala. Aguarde um instante…');
}
function teardown(){
  try{ if(peer) peer.destroy(); }catch(e){}
  peer=null; hostConn=null; conns.clear(); V=null;
}
function failHome(msg){ teardown(); if(isHost){ S=null; } isHost=false; mode='home'; ui.err=msg||''; render(); }
function leaveRoom(){
  if(isHost && !confirm('Se você sair, a sala será encerrada para todos. Sair mesmo?')) return;
  if(isHost) store.del('adv-host');
  teardown(); S=null; isHost=false; roomCode=''; setUrl(''); mode='home'; ui.err=''; render();
}

      <div class="qtext">“${esc(e?e.text:'')}”</div>
      <p class="note">Lembrete: seu item é <b>${esc(me.item.n)}</b>.</p>
      <div class="ansrow"><button class="btn yes" data-ans="sim">Sim</button><button class="btn no" data-ans="nao">Não</button><button class="btn maybe" data-ans="naosei">Não sei</button></div></section>`;
  } else if(pend){
    top=`<section class="card wait"><div class="dots"></div><div><b>${esc(nameOf(pend.to))}</b> está respondendo à pergunta de ${esc(nameOf(pend.from))}…</div></section>`;
  } else if(myTurn){
    top=renderActions(me);
  }
  const bar=cur?`<div class="turnbar" style="--pc:${COLORS[cur.color]}">${avatar(cur)}<span>${myTurn?'Sua vez!':'Vez de '+esc(cur.name)}${cur.online?'':' (offline)'}</span></div>`:'';
  const tools=host?`<section class="card"><div class="eyebrow">Controles do anfitrião</div><div class="row" style="margin-top:8px">
      <button class="btn sm" data-do="skip">⏭️ Pular a vez de ${esc(cur?cur.name:'')}</button>
      <button class="btn sm ghost" data-do="lobby">Encerrar partida</button></div>
      <p class="note">Use “pular” se alguém saiu ou travou.</p></section>`:'';
  return bar+(me?secretCard(me):'')+top+playersHtml()+historyHtml()+tools;
}
function renderOver(){
  const host=V.hostPid===V.me;
  const max=Math.max(...V.players.map(p=>p.score));
  const winners=V.players.filter(p=>p.score===max);
  const ranked=V.players.slice().sort((a,b)=>b.score-a.score);
  return `<section class="card center"><div class="trophy">🏆</div>
    <h1>${winners.length>1?'Empate!':esc(winners[0].name)+' venceu!'}</h1>
    <p class="muted">${winners.length>1?winners.map(w=>esc(w.name)).join(', ')+' terminaram com '+max+' ponto'+(max===1?'':'s')+'.':'Com '+max+' ponto'+(max===1?'':'s')+'.'}</p>
    <ul class="rank" style="margin-top:14px;text-align:left">${ranked.map(p=>`<li class="${p.score===max?'win':''}">${avatar(p)}<b style="flex:1">${esc(p.name)}</b><span class="small muted">${esc(p.item?p.item.n:'')}</span><span class="score">⭐ ${p.score}</span></li>`).join('')}</ul>
    ${host?`<button class="btn primary big" style="margin-top:14px" data-do="start">Jogar de novo</button>
      <button class="btn ghost" style="margin-top:8px" data-do="lobby">Voltar para a sala de espera</button>`
      :`<p class="muted" style="margin-top:14px">Aguardando ${esc(nameOf(V.hostPid))} começar outra partida…</p>`}
  </section>${playersHtml()}${historyHtml()}`;
}
function renderTopbar(){
  const tb=$('#topbar');
  if(mode!=='room'||!V){ tb.hidden=true; return; }
  tb.hidden=false;
  tb.innerHTML=`<div class="brand">❓ Adivinha o que é</div><div class="row"><span class="tag">Sala ${esc(V.code)}</span><button class="btn ghost sm" data-do="leave">Sair</button></div>`;
}
function render(){
  const saved={}; let focusKey=null, sel=null;
  document.querySelectorAll('[data-keep]').forEach(el=>{
    saved[el.dataset.keep]=el.value;
    if(el===document.activeElement){ focusKey=el.dataset.keep; try{ sel=[el.selectionStart,el.selectionEnd]; }catch(e){} }
  });
  let html='';
  if(mode==='home') html=renderHome();
  else if(mode==='connecting') html=renderConnecting();
  else if(V&&V.phase==='lobby') html=renderLobby();
  else if(V&&V.phase==='playing') html=renderGame();
  else if(V&&V.phase==='over') html=renderOver();
  app.innerHTML=html;
  renderTopbar();
  document.querySelectorAll('[data-keep]').forEach(el=>{
    const k=el.dataset.keep;
    if(saved[k]!==undefined) el.value=saved[k];
    if(k===focusKey){ el.focus(); try{ if(sel) el.setSelectionRange(sel[0],sel[1]); }catch(e){} }
  });
  const q=$('#qr');
  if(q&&typeof qrcode!=='undefined'){ try{ const g=qrcode(0,'M'); g.addData(shareUrl()); g.make(); q.innerHTML=g.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){ q.remove(); } }
  else if(q) q.remove();
}

/* ------------------------------- eventos ------------------------------- */
function readName(){
  const v=($('#name')?$('#name').value:'').trim().slice(0,20);
  if(!v){ toast('Digite seu nome primeiro.'); $('#name')&&$('#name').focus(); return null; }
  myName=v; store.set('adv-name',v); return v;
}
function doAction(what){
  switch(what){
    case 'create': if(readName()){ ui.err=''; hostRoom(genCode(),false); } break;
    case 'join':   if(readName()){ ui.err=''; joinRoom(roomCode); } break;
    case 'joincode': {
      const c=($('#code').value||'').toUpperCase().replace(/[^A-Z]/g,'').slice(0,6);
      if(c.length<4){ toast('Digite o código da sala (4 letras).'); return; }
      if(readName()){ ui.err=''; setUrl(c); joinRoom(c); } break; }
    case 'forget': roomCode=''; setUrl(''); ui.err=''; render(); break;
    case 'cancel': failHome(''); break;
    case 'leave':  leaveRoom(); break;
    case 'copy': {
      const url=shareUrl();
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(()=>toast('Link copiado!'),()=>toast('Não deu para copiar. Selecione o link e copie.'));
      else toast('Selecione o link e copie.');
      break; }
    case 'share': navigator.share({title:'Adivinha o que é',text:'Vem jogar comigo! Sala '+roomCode,url:shareUrl()}).catch(()=>{}); break;
    case 'peek': ui.peek=!ui.peek; render(); break;
    case 'start': case 'lobby': send({a:what}); break;
    case 'skip': if(confirm('Pular a vez deste jogador?')) send({a:'skip'}); break;
    case 'ask': { const i=$('#qtext'); const text=(i.value||'').trim(); if(!text){ toast('Escolha ou escreva uma pergunta.'); return; } i.value=''; send({a:'ask',to:ui.target,text}); break; }
    case 'hint': send({a:'hint',to:ui.target}); break;
    case 'guess': { const i=$('#guess'); const text=(i.value||'').trim(); if(!text){ toast('Escreva seu palpite.'); return; } i.value=''; send({a:'guess',to:ui.target,text}); break; }
  }
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-do],[data-ans],[data-target],[data-tab]'); if(!b||b.disabled) return;
  if(b.dataset.do) return doAction(b.dataset.do);
  if(b.dataset.ans) return send({a:'answer',ans:b.dataset.ans});
  if(b.dataset.target){ ui.target=b.dataset.target; return render(); }
  if(b.dataset.tab){ ui.tab=b.dataset.tab; return render(); }
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.change==='cat') send({a:'cat',cat:el.value});
  if(el.dataset.change==='pickq'&&el.value){ const i=$('#qtext'); if(i) i.value=el.value; el.value=''; }
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter') return;
  const el=e.target;
  if(el.dataset&&el.dataset.enter){ e.preventDefault(); doAction(el.dataset.enter); }
  else if(el.id==='name'){ e.preventDefault(); doAction(roomCode?'join':'create'); }
  else if(el.id==='code'){ e.preventDefault(); doAction('joincode'); }
});

/* ------------------------------- início ------------------------------- */
(function init(){
  const saved=store.get('adv-host');
  if(roomCode&&saved&&saved.S&&saved.S.code===roomCode&&saved.myPid===myPid){
    // O anfitrião recarregou a página: recupera a partida.
    S=saved.S; S.players.forEach(p=>{ p.online=(p.pid===myPid); });
    hostRoom(roomCode,true);
  } else render();
})();
</script>
